name: 重建站点

# 「今天」在构建时确定（见 next.config.ts），站点不会自己往前翻页：
# 不重建的话，首页与日历会永远停在最后一次构建的那一天。
#
# 这条工作流有两种用法：
#   1. 手动触发（workflow_dispatch）——演示或面试前点一下，保证线上日期是当天；
#   2. 定时触发（schedule）——每天让「今天」跟上真实日期。
#
# 注意：GitHub 会在仓库 60 天没有活动时自动停用 schedule 工作流。本项目平时若
# 没有提交，定时可能被静默停掉，此时可改用外部定时器（见 DEPLOY.md 的
# cron-job.org 方案）。两者只需开一个——同时开着会每天重建两次。

on:
  schedule:
    # 每天 16:05 UTC = 北京时间次日 00:05，零点一过就刷新
    - cron: '5 16 * * *'
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: 触发 Cloudflare Pages 重新部署
        env:
          DEPLOY_HOOK: ${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::缺少仓库密钥 CLOUDFLARE_DEPLOY_HOOK。请在 Cloudflare 项目 → Settings → Builds → Add deploy hook（Branch to build 填 main）建一个 hook，把它的 URL 存成同名仓库密钥。"
            exit 1
          fi
          curl -fsS -X POST "$DEPLOY_HOOK"
