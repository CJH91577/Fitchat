name: CI

# 每次推送与 PR 都跑一遍测试、lint 与生产构建。
# 交付前的三条命令在这里自动执行，README 顶部的徽章就是它的结果。

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
